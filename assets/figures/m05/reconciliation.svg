<svg xmlns="http://www.w3.org/2000/svg" width="620" height="444" viewBox="0 0 620 444" role="img" aria-labelledby="title desc" xml:lang="zh-CN">
  <title id="title">托管应领的两张单据，以及到账通知的事务边界</title>
  <desc id="desc">结算块 3 的真实 Settled 事件只支持指定受益人应领 125 wei。订单写 126 wei 时差额为 1，不入账。退役未入账的差异演练单后，另一独占意图写 125 wei；链尖和游标同为块 4，两次确认，数据库一笔事务生成一行应领流水和一行 outbox。回调不是金额来源。</desc>
  <rect width="620" height="444" rx="9" fill="#fcf8ef"/>
  <g font-family="system-ui,sans-serif" fill="#202b28">
    <text x="24" y="39" font-size="24" font-weight="700">这份应领凭据，够核销哪张单？</text>
    <text x="24" y="67" font-size="16">同一部署，两种互斥意图 · 单位：本链原生币的 wei</text>
    <rect x="24" y="86" width="572" height="65" rx="7" fill="#e5eee9" stroke="#45715f"/>
    <text x="39" y="113" font-size="19" font-weight="700">日志 → 对账员　块 3：Settled(B, 125)</text>
    <text x="39" y="137" font-size="16">B 是清单指定受益人；没有证明 B 的钱包已收款。</text>
    <path d="M165 153v19m290-19v19" fill="none" stroke="#645f52" stroke-width="2"/>
    <path d="m159 166 6 8 6-8m278 0 6 8 6-8" fill="none" stroke="#645f52" stroke-width="2"/>
    <rect x="24" y="179" width="276" height="126" rx="7" fill="#fff0df" stroke="#965e32"/>
    <rect x="314" y="179" width="282" height="126" rx="7" fill="#e7f1ed" stroke="#356f5b"/>
    <g font-size="17"><text x="40" y="208" font-weight="700">试单 A · 应收 126 wei</text><text x="40" y="238">126 − 125 = 1 wei</text><text x="40" y="266">提醒中写足额，也不能核销</text><text x="40" y="290" font-weight="700">HOLD_AMOUNT · 不入账</text>
    <text x="329" y="208" font-weight="700">试单 B · 应收 125 wei</text><text x="329" y="238">125 − 125 = 0 wei</text><text x="329" y="266">头 = 游标 = 块 4，哈希一致</text><text x="329" y="290" font-weight="700">4 − 3 + 1 = 2 次确认</text></g>
    <path d="M455 307v20m-6-6 6 8 6-8" fill="none" stroke="#356f5b" stroke-width="2"/>
    <rect x="24" y="336" width="572" height="85" rx="7" fill="#f3ecdc" stroke="#88775b"/>
    <text x="39" y="365" font-size="18" font-weight="700">B 的回调 → 同一事务：1 行应领流水 + 1 行 outbox</text>
    <text x="39" y="393" font-size="16">两行都落库或都不落库；积压或换支时，旧通知不能作放货令。</text>
  </g>
</svg>
