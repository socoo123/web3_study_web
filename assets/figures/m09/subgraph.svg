<svg xmlns="http://www.w3.org/2000/svg" width="600" height="434" viewBox="0 0 600 434" role="img" xml:lang="zh-CN" aria-labelledby="t d">
  <title id="t">先钉住块，再比较两张账页</title>
  <desc id="d">块 2 锁入 125 wei，块 3 为 B 记应领，块 4 才领取。两套读端同查块 3 的哈希，均应返回 2 条日志。若映射从块 3 才开始，即使游标已追平也只剩 1 条。</desc>
  <defs><marker id="arrow" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0l8 4-8 4z" fill="#47675a"/></marker></defs>
  <rect width="600" height="434" fill="#fffaf2"/>
  <g font-family="system-ui, sans-serif" fill="#22332c">
