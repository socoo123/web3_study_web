<svg xmlns="http://www.w3.org/2000/svg" width="600" height="520" viewBox="0 0 600 520" role="img" xml:lang="zh-CN" aria-labelledby="title desc">
  <title id="title">通道的两套账：一笔链上输出，两张方向不同的发票</title>
  <desc id="desc">链上注资创建 500000 sat 输出 F:n。支付期间输出不变。两节点见到 Alice 向 Bob 支付 50000 sat 成功，反向 60000 sat 超过 Bob 的本地余额而失败。最后关闭交易花费 F:n，回到链上结算。</desc>
  <rect width="600" height="520" fill="#fffaf2"/>
  <g fill="#22332c" font-family="system-ui, sans-serif">
    <text x="22" y="37" font-size="24" font-weight="700">LN-33 · 同一段时间，两份账本</text>
    <text x="23" y="65" font-size="16">默认金额以 sat 计；F:n 是本轮实际 txid:vout 的简写。</text>
    <rect x="18" y="83" width="211" height="403" rx="5" fill="#e8edf0"/>
    <rect x="238" y="83" width="344" height="403" rx="5" fill="#edf2e7"/>
    <text x="32" y="115" font-size="20" font-weight="700">Bitcoin Core · 链上</text>
    <text x="253" y="115" font-size="20" font-weight="700">Alice / Bob · 节点内</text>
    <path d="M31 130h183M253 130h314" stroke="#849388"/>
    <text x="32" y="158" font-size="19" font-weight="600">① 创建 F:n</text>
    <text x="32" y="183" font-size="18">锁定 500,000 sat</text>
    <text x="253" y="158" font-size="19" font-weight="600">通道 active</text>
    <text x="253" y="183" font-size="17">Alice 出资；Bob 起始份额 0</text>
    <path d="M120 204v160" stroke="#637a84" stroke-width="2" stroke-dasharray="4 5"/>
    <rect x="28" y="250" width="190" height="59" rx="4" fill="#f6f8f8"/>
    <text x="41" y="274" font-size="18" font-weight="600">F:n 仍未花费</text>
    <text x="41" y="297" font-size="16">无新的链上付款</text>
    <rect x="249" y="208" width="321" height="75" rx="4" fill="#d9e9d9"/>
    <text x="260" y="236" font-size="18" font-weight="600">② Alice → Bob　50,000</text>
    <text x="260" y="263" font-size="17">成功：Bob 本地份额变为 50,000</text>
    <rect x="249" y="295" width="321" height="80" rx="4" fill="#f2e3d5"/>
    <text x="260" y="324" font-size="18" font-weight="600">③ Bob → Alice　60,000</text>
    <text x="260" y="352" font-size="17">拒付：只持有 50,000，两端不变</text>
    <path d="M31 390h183M253 390h314" stroke="#849388"/>
    <text x="32" y="420" font-size="19" font-weight="600">④ 花费 F:n</text>
    <text x="32" y="448" font-size="17">分账输出 + 矿工费</text>
    <text x="253" y="420" font-size="19" font-weight="600">两端协作关闭</text>
    <text x="253" y="448" font-size="17">关通道摘要引用同一关闭交易</text>
    <text x="22" y="508" font-size="15">链上按 outpoint 查资金；节点按 payment hash 查发票与付款。</text>
  </g>
</svg>
