<svg xmlns="http://www.w3.org/2000/svg" width="640" height="510" viewBox="0 0 640 510" role="img" xml:lang="zh-CN" aria-labelledby="title desc">
  <title id="title">两次验证只换一个域元素</title>
  <desc id="desc">证明方用公开教学向量一、二作为电路的两个私有输入。只把证明和公有信号交给验证方，不交见证文件。验证方固定本轮验证密钥和同一证明，给原承诺时通过，给加一后的合法域元素时拒绝。</desc>
  <defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0l8 4-8 4z" fill="#516c5f"/></marker></defs>
  <rect width="640" height="510" fill="#fffaf2"/>
  <g fill="#23372e" font-family="system-ui, sans-serif">
    <text x="24" y="40" font-size="25" font-weight="700">Z-35 · 一份证明，两张验收单</text>
    <text x="24" y="68" font-size="17">所有数都是域元素，无金额单位。图中仅显示承诺末四位。</text>
    <rect x="24" y="91" width="592" height="94" rx="5" fill="#ecf1e7" stroke="#748775"/>
    <text x="42" y="124" font-size="20" font-weight="700">证明方 · 本地计算</text>
    <text x="42" y="152" font-size="18">有序输入 (1, 2) → Poseidon(2) → 承诺 C</text>
    <text x="42" y="175" font-size="15">输入与中间赋值留在见证文件，不随证明寄送。</text>
    <path d="M320 186v38" fill="none" stroke="#516c5f" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="24" y="230" width="592" height="73" rx="5" fill="#e6edf1" stroke="#718493"/>
    <text x="42" y="262" font-size="20" font-weight="700">验证方 · 固定同一把 VK、同一份 proof</text>
    <text x="42" y="287" font-size="17">每次再喂一个公开数；不输入 (1, 2)，不重做证明。</text>
    <g fill="none" stroke="#516c5f" stroke-width="2" marker-end="url(#arrow)"><path d="M320 303v18H168v20"/><path d="M320 303v18h152v20"/></g>
    <rect x="24" y="348" width="284" height="89" rx="5" fill="#e3eee2" stroke="#748775"/>
    <text x="40" y="378" font-size="19" font-weight="700">[C]　末四位 3530</text>
    <text x="40" y="414" font-size="20">通过　OK! · 退出 0</text>
    <rect x="332" y="348" width="284" height="89" rx="5" fill="#f6e6d9" stroke="#a27c65"/>
    <text x="348" y="378" font-size="19" font-weight="700">[C + 1]　末四位 3531</text>
    <text x="348" y="414" font-size="20">拒绝　Invalid proof · 退出 1</text>
    <path d="M24 459h592" stroke="#a59d8b"/>
    <text x="24" y="487" font-size="17">第一张单也不认证持单人的身份，更不能据此核销一笔付款。</text>
  </g>
</svg>
