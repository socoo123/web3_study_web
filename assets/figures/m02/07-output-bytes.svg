<svg xmlns="http://www.w3.org/2000/svg" width="448" height="370" viewBox="0 0 448 370" role="img" aria-labelledby="title desc">
  <title id="title">两个原生见证输出，按字节读</title>
  <desc id="desc">从左到右读版本操作码、推入长度、见证程序。P2WPKH 为 00、14 和 20 字节公钥哈希，共 22 字节，地址用 Bech32。P2TR 为 51、20 和 32 字节输出公钥，共 34 字节，地址用 Bech32m。</desc>
  <rect width="448" height="370" fill="#fffaf2"/>
  <g font-family="system-ui,sans-serif" fill="#28221f">
    <text x="18" y="35" font-size="23" font-weight="700">读输出，而不是读户名</text>
    <text x="18" y="63" font-size="17">脚本按字节从左往右读，框宽不代表长度。</text>
    <g font-size="17" fill="#5c5047" text-anchor="middle">
      <text x="60" y="103">版本码</text><text x="150" y="103">长度</text><text x="309" y="103">见证程序</text>
    </g>
    <g stroke="#216459" stroke-width="1.7" fill="#e7f3ed">
      <rect x="18" y="117" width="84" height="54" rx="7"/><rect x="108" y="117" width="84" height="54" rx="7"/><rect x="198" y="117" width="232" height="54" rx="7"/>
    </g>
    <g fill="#164f46" text-anchor="middle" font-weight="650">
      <text x="60" y="153" font-size="24" font-family="monospace">00</text><text x="150" y="153" font-size="24" font-family="monospace">14</text><text x="314" y="151" font-size="19">20 字节 · 公钥哈希</text>
    </g>
    <text x="18" y="199" font-size="18" font-weight="650">P2WPKH · 版本 0 · 共 22 字节</text>
    <text x="18" y="224" font-size="17">地址编码：Bech32</text>
    <g stroke="#93441e" stroke-width="1.7" fill="#faebde">
      <rect x="18" y="241" width="84" height="54" rx="7"/><rect x="108" y="241" width="84" height="54" rx="7"/><rect x="198" y="241" width="232" height="54" rx="7"/>
    </g>
    <g fill="#763615" text-anchor="middle" font-weight="650">
      <text x="60" y="277" font-size="24" font-family="monospace">51</text><text x="150" y="277" font-size="24" font-family="monospace">20</text><text x="314" y="275" font-size="19">32 字节 · 输出公钥</text>
    </g>
    <text x="18" y="323" font-size="18" font-weight="650">P2TR · 版本 1 · 共 34 字节</text>
    <text x="18" y="348" font-size="17">地址编码：Bech32m</text>
  </g>
</svg>
