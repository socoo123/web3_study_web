<svg xmlns="http://www.w3.org/2000/svg" width="600" height="496" viewBox="0 0 600 496" role="img" aria-labelledby="title desc" xml:lang="zh-CN">
  <title id="title">一次登录的三方时序</title><desc id="desc">从上到下，浏览器向 Java 申请链 31337 上地址 A 的挑战。Java 给 32 位十六进制 nonce 与 120 秒期限。浏览器请求签名，签名器拒绝时没有签名、没有会话；确认才返回 65 字节签名。Java 验原文、恢复 A、一次消费。用同一凭证再核验返回 409；换账户或网络时撤销登录。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#67594e"/></marker></defs>
  <rect width="600" height="496" fill="#fffaf2"/>
  <g font-family="system-ui,sans-serif" fill="#262321"><text x="20" y="35" font-size="23" font-weight="700">谁能把「已连接」变成「已登录」？</text>
    <g text-anchor="middle" font-size="17" font-weight="650"><text x="90" y="80">Java 登录服务</text><text x="300" y="80">浏览器登录台</text><text x="510" y="80">用户的签名器</text></g>
    <g fill="none" stroke="#b7a793" stroke-dasharray="5 4"><path d="M90 93v281M300 93v281M510 93v177"/></g>
    <g fill="none" stroke="#67594e" stroke-width="2" marker-end="url(#arrow)"><path d="M300 127H91"/><path d="M90 176h209"/><path d="M300 219h209"/><path d="M510 266H301"/><path d="M300 312H91"/><path d="M90 361h209"/></g>
    <g text-anchor="middle" font-size="16"><text x="195" y="117">A 请求挑战 · 链 31337</text><text x="195" y="163">原文含 nonce · 限时 120 秒</text><text x="405" y="207">personal_sign（原文字节）</text><text x="405" y="254">确认：返回 65 字节签名</text><text x="195" y="299">原文 + 签名 + 浏览器 Cookie</text><text x="195" y="349">验签、消费后才确认会话 A</text></g>
    <rect x="20" y="393" width="560" height="83" rx="7" fill="#e5eee9" stroke="#547364"/><g font-size="16"><text x="34" y="420">拒签 4001：没有签名返回；服务端仍是 ANONYMOUS。</text><text x="34" y="445">同一原文再次验证：409 NO_CHALLENGE，不创建第二次登录。</text><text x="34" y="466" font-size="14">等待中换账户或链：不用旧返回值，浏览器同时请求服务端撤销。</text></g>
  </g>
</svg>
