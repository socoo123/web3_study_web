<svg xmlns="http://www.w3.org/2000/svg" width="576" height="530" viewBox="0 0 576 530" role="img" xml:lang="zh-CN" aria-labelledby="title desc">
  <title id="title">同块估值：先核两张价签，再分清两条线</title>
  <desc id="desc">H 块有 2.5 COL，每枚值 160 Q；负债 200 NOTE，每枚值 1.25 Q。价格缺失或年龄超过 300 秒时停止估值。新鲜时，400 Q 乘 65% 减去 250 Q 得借入估算余量 10 Q；400 Q 乘 75% 除以 250 Q 得健康度 1.2，没有借款交易。</desc>
  <rect width="576" height="530" fill="#fffaf2"/>
  <g font-family="system-ui,sans-serif" fill="#262321">
    <text x="22" y="38" font-size="25" font-weight="700">同一块 H 的估值凭条</text>
    <text x="22" y="68" font-size="17">仓位与独立报价源都读 H；计价单位 Q，不是币的数量。</text>
    <rect x="20" y="88" width="536" height="114" rx="6" fill="#f5eadb" stroke="#846c55"/>
    <g font-size="18"><text x="36" y="117" font-weight="700">估值端读两张价签</text>
      <text x="36" y="150">抵押　2.5 COL × 160 Q/COL = 400 Q</text>
      <text x="36" y="181">负债　200 NOTE × 1.25 Q/NOTE = 250 Q</text>
    </g>
    <path d="M288 202v22" stroke="#756352" stroke-width="2"/><path d="m282 218 6 7 6-7" fill="none" stroke="#756352" stroke-width="2"/>
    <rect x="20" y="226" width="536" height="78" rx="6" fill="#ffeddb" stroke="#915b36"/>
    <text x="36" y="255" font-size="18" font-weight="700">两路都已发布、价格为正、年龄 0…300 秒？</text>
    <text x="36" y="285" font-size="17">否 → 停报：例如 301 秒，健康度和余量均不可用。</text>
    <path d="M288 304v22" stroke="#756352" stroke-width="2"/><path d="m282 320 6 7 6-7" fill="none" stroke="#756352" stroke-width="2"/>
    <rect x="20" y="328" width="536" height="178" rx="6" fill="#e2f1eb" stroke="#286657"/>
    <text x="36" y="358" font-size="19" font-weight="700">是 → 分别回答两个问题</text>
    <text x="36" y="390" font-size="18">借入限额线 65%：400 × 0.65 − 250 = 10 Q</text>
    <text x="36" y="416" font-size="16">估值余量，不是能再提走 10 枚 NOTE。</text>
    <path d="M36 431h502" stroke="#9abbb1"/>
    <text x="36" y="459" font-size="18">清算阈值线 75%：400 × 0.75 ÷ 250 = 1.2</text>
    <text x="36" y="486" font-size="16">健康度无单位；低于 1 才落到该线之下。</text>
  </g>
</svg>
