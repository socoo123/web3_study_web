<svg xmlns="http://www.w3.org/2000/svg" width="480" height="468" viewBox="0 0 480 468" role="img" aria-labelledby="t d" xml:lang="zh-CN">
  <title id="t">第 2 块还是第 2 块，付款的区块锚点却变了</title>
  <desc id="d">本地 Anvil 演练：第 1 块安装商户程序。旧分支第 2 块 A 含订单交易 T，自身即为一次确认，其子块 A3 使确认数为二。恢复第 1 块快照并手挖空块后，同高度的新块 B 不含 T。旧回执的 A 哈希与当前 B 哈希不符，不能再沿用旧确认数。</desc>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#534a43"/></marker></defs>
  <rect width="480" height="468" fill="#fffaf2"/>
  <g fill="#28221f" font-family="system-ui,sans-serif">
    <text x="20" y="38" font-weight="700" font-size="25">旧回执还能用吗？先查同高度的哈希</text>
    <text x="20" y="68" font-size="18">本地快照演练 · 箭头从父块指向子块</text>
    <g stroke="#534a43" stroke-width="2" fill="none" marker-end="url(#arr)"><path d="M210 136 123 178"/><path d="M270 136 357 178"/><path d="M124 263v32"/></g>
    <rect x="130" y="90" width="220" height="47" rx="8" fill="#f5eadb" stroke="#755f4c"/>
    <g fill="#dff2ea" stroke="#226957"><rect x="20" y="184" width="208" height="78" rx="8"/><rect x="20" y="301" width="208" height="68" rx="8"/></g>
    <rect x="252" y="184" width="208" height="78" rx="8" fill="#ffeedb" stroke="#904826"/>
    <g text-anchor="middle" font-size="19">
      <text x="240" y="120" font-weight="700">块 1 · 商户已就绪</text>
      <text x="124" y="217" font-weight="700">旧块 2 · 哈希 A</text><text x="124" y="245">含付款 T · 1 次确认</text>
      <text x="356" y="217" font-weight="700">新块 2 · 哈希 B</text><text x="356" y="245">空块 · 不含 T</text>
      <text x="124" y="329" font-weight="700">旧块 3 · 父哈希 A</text><text x="124" y="355">同一笔 T · 2 次确认</text>
      <text x="356" y="320" fill="#75391c">恢复块 1 后重挖</text><text x="356" y="350" fill="#75391c">新链上 T 暂无回执</text>
    </g>
    <path d="M20 392H460" stroke="#b9aa99"/>
    <text x="20" y="421" font-weight="700" font-size="20">旧回执写 A，当前高度 2 却读到 B。</text>
    <text x="20" y="451" font-size="18">停止沿用「2 次确认」；保留旧锚点，订单待复核。</text>
  </g>
</svg>
