<svg xmlns="http://www.w3.org/2000/svg" width="608" height="570" viewBox="0 0 608 570" role="img" xml:lang="zh-CN" aria-labelledby="title desc">
  <title id="title">S-32 · 两个 ATA 的账，费用另记</title>
  <desc id="desc">本地 6 位精度 mint。发行后仓库 ATA 有 2500000 个最小单位，收货 ATA 为 0。先错报 5 位，两侧不动；按 6 位转 1250001 后，两侧为 1249999 和 1250001，总供应仍是 2500000。支付者的交易费以 lamports 计。</desc>
  <rect width="608" height="570" fill="#fffaf2"/>
  <g font-family="system-ui,sans-serif" fill="#252c2d">
    <text x="25" y="41" font-size="25" font-weight="700">S-32　这次交货改了哪两行？</text>
    <text x="25" y="72" font-size="17">同一创世 · 同一 mint · 以下代币数量均为最小单位</text>
    <rect x="22" y="95" width="564" height="81" rx="7" fill="#e6eeef" stroke="#517275"/>
    <text x="40" y="125" font-size="19" font-weight="700">发行后　supply = 2,500,000</text>
    <text x="40" y="155" font-size="17">精度 6　／　仓库 ATA 已入账　／　收货 ATA 仍为 0</text>
    <g font-size="18" font-weight="700"><text x="40" y="221">TransferChecked</text><text x="353" y="221" text-anchor="end">仓库 ATA</text><text x="565" y="221" text-anchor="end">收货 ATA</text></g>
    <path d="M25 238h558" stroke="#b09b7e" stroke-width="2"/>
    <text x="40" y="272" font-size="17">① 错报精度 5</text>
    <g font-size="21"><text x="353" y="273" text-anchor="end">2,500,000</text><text x="565" y="273" text-anchor="end">0</text></g>
    <text x="40" y="306" font-size="17" fill="#865038">拒绝：Custom 18；两侧差额都是 0。</text>
    <path d="M25 328h558" stroke="#b09b7e"/>
    <text x="40" y="364" font-size="17">② 正确精度 6</text>
    <g font-size="21" fill="#245c4f" font-weight="700"><text x="353" y="365" text-anchor="end">1,249,999</text><text x="565" y="365" text-anchor="end">1,250,001</text></g>
    <text x="40" y="399" font-size="17">方向：仓库 → 收货　｜　实转 1,250,001，总供应不变。</text>
    <rect x="22" y="430" width="564" height="114" rx="7" fill="#e2f1eb" stroke="#286657"/>
    <text x="40" y="461" font-size="19" font-weight="700">另一本账　·　费用支付者的 SOL</text>
    <text x="40" y="493" font-size="17">两次转账尝试各自查 meta.fee，单位是 lamports。</text>
    <text x="40" y="521" font-size="17">不能从收货 ATA 的代币数量里减掉这笔费。</text>
  </g>
</svg>
