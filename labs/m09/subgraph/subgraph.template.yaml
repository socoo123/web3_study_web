specVersion: 1.3.0
schema:
  file: ./schema.graphql
indexerHints:
  prune: never
dataSources:
  - kind: ethereum/contract
    name: Escrow
    network: course
    source:
      address: '$address'
      abi: Escrow
      startBlock: $startBlock
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities: [Posting]
      abis:
        - name: Escrow
          file: ./Escrow.json
      eventHandlers:
        - event: Locked(indexed address,uint256)
          handler: handleLocked
        - event: Settled(indexed address,uint256)
          handler: handleSettled
        - event: Refunded(indexed address,uint256)
          handler: handleRefunded
        - event: Withdrawn(indexed address,uint256)
          handler: handleWithdrawn
      file: ./mapping.ts
