services:
  anvil:
    image: postgres:17.5-bookworm
    user: nobody
    entrypoint: [/opt/course/anvil]
    volumes: ['${M09_ANVIL:?prepare Linux Anvil first}:/opt/course/anvil:ro']
    command: [--host, 0.0.0.0, --port, '8545', --chain-id, '31337', --hardfork, cancun, --accounts, '2', --balance, '10', --mnemonic-random, '12', --no-cors, --quiet]
    ports: ['127.0.0.1:18556:8545']
  postgres:
    image: postgres:17.5-bookworm
    command: [postgres, -cshared_preload_libraries=pg_stat_statements, -cmax_connections=200]
    environment:
      POSTGRES_USER: course
      POSTGRES_PASSWORD: course-local
      POSTGRES_DB: graph
      POSTGRES_INITDB_ARGS: '-E UTF8 --locale=C'
    ports: ['127.0.0.1:18557:5432']
    healthcheck:
      test: [CMD, pg_isready, -q, -h, 127.0.0.1, -U, course, -d, graph]
      interval: 1s
      timeout: 3s
      retries: 60
  ipfs:
    image: ipfs/kubo:v0.34.1
    command: [daemon, --offline]
    ports: ['127.0.0.1:19342:5001']
  graph:
    image: graphprotocol/graph-node:v0.45.0
    platform: linux/amd64
    depends_on:
      postgres:
        condition: service_healthy
      ipfs:
        condition: service_started
      anvil:
        condition: service_started
    environment:
      postgres_host: postgres
      postgres_user: course
      postgres_pass: course-local
      postgres_db: graph
      ipfs: 'ipfs:5001'
      ethereum: 'course:archive:http://anvil:8545'
      ethereum_polling_interval: '400'
      GRAPH_LOG: info
      node_id: course34
    ports: ['127.0.0.1:19340:8000', '127.0.0.1:19341:8020']
